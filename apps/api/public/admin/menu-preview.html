<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Menu preview · Swiss Bakery</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Match the in-store price-card palette: vivid orange paper,
           charcoal copy, white decorative frame and accent lines, brand-red
           prices for emphasis. */
        --paper: #f37020;
        --ink: #1c1715;
        --gold: #ffffff;
        --gold-soft: rgba(255, 255, 255, 0.6);
        --price: #ffffff;
        --muted: rgba(28, 23, 21, 0.55);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: #4a4f59;
        color: var(--ink);
        font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(11, 20, 38, 0.94);
        color: #fff;
        padding: 10px 16px;
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
        font-size: 13px;
        backdrop-filter: blur(6px);
      }
      .toolbar span { opacity: 0.85; }
      .toolbar button {
        font: inherit;
        padding: 7px 14px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: transparent;
        color: #fff;
        cursor: pointer;
      }
      .toolbar button.primary {
        background: var(--gold);
        color: #1a2a4f;
        border-color: var(--gold);
        font-weight: 700;
      }
      .toolbar button:hover { opacity: 0.92; }
      .stage {
        display: grid;
        place-items: center;
        padding: 28px 16px 80px;
        gap: 24px;
      }
      .page {
        position: relative;
        background: var(--paper);
        width: 210mm;
        min-height: 297mm;
        padding: 18mm 18mm 22mm;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
      }
      .frame {
        position: absolute;
        inset: 8mm;
        border: 1.5px solid var(--gold);
        pointer-events: none;
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 2.5mm;
        border: 0.6px solid var(--gold);
      }
      .header {
        position: relative;
        text-align: center;
        padding-top: 4mm;
      }
      .logo {
        width: 26mm;
        height: 26mm;
        margin: 0 auto 4mm;
        border-radius: 50%;
        overflow: hidden;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 2px 6px rgba(26, 42, 79, 0.12);
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 1mm;
      }
      .tagline {
        font-family: "Playfair Display", serif;
        font-style: italic;
        color: var(--ink);
        font-size: 13pt;
        margin: 0 0 2mm;
      }
      .strapline {
        color: var(--gold);
        letter-spacing: 0.18em;
        font-size: 8pt;
        font-weight: 600;
      }
      .top-divider {
        margin: 6mm auto 5mm;
        height: 1px;
        background: var(--gold);
        opacity: 0.5;
      }
      .cat {
        position: relative;
        margin: 0 0 7mm;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      /* JS paginator wrappers (replace the old .cat box so categories can
         flow across pages). page-body holds the flowing content inside the
         page padding; cat-headblock is the title+rule+subtitle unit. */
      .page-body {
        position: relative;
        height: 100%;
      }
      .cat-headblock {
        margin: 0 0 1mm;
        /* a tiny top padding stops the inner .cat-head margin from collapsing
           through the wrapper, so getBoundingClientRect() is accurate */
        padding-top: 0.1px;
      }
      .page-body .items {
        margin-bottom: 6mm;
      }
      .cat-head {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 7mm;
        margin: 2mm 0 1mm;
      }
      .cat-head .rule {
        height: 1px;
        background: var(--gold);
        opacity: 0.55;
      }
      .cat-head h2 {
        font-family: "Playfair Display", serif;
        color: var(--ink);
        font-weight: 700;
        font-size: 17pt;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .cat-sub {
        font-family: "Playfair Display", serif;
        font-style: italic;
        color: var(--gold);
        text-align: center;
        font-size: 9pt;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin: 0 0 4mm;
      }
      .items {
        display: grid;
        gap: 0.8mm 8mm;
      }
      .items.cols-1 { grid-template-columns: 1fr; }
      .items.cols-2 { grid-template-columns: 1fr 1fr; }
      .items.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
      .items.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
      .item {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        gap: 4mm;
        padding: 0.7mm 0;
        font-size: 10.5pt;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .item.with-photo {
        grid-template-columns: 11mm 1fr auto;
        align-items: center;
      }
      .item .thumb {
        width: 11mm;
        height: 11mm;
        background: #fff center / cover no-repeat;
        border: 0.6px solid var(--gold);
        border-radius: 50%;
      }
      .item .name {
        color: var(--ink);
        font-weight: 500;
      }
      .item .price {
        color: var(--gold);
        font-weight: 700;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .item .price.muted {
        color: var(--muted);
        font-style: italic;
        font-weight: 500;
      }
      .footer {
        position: absolute;
        bottom: 12mm;
        left: 18mm;
        right: 18mm;
        text-align: center;
      }
      .footer .note {
        font-family: "Playfair Display", serif;
        font-style: italic;
        color: var(--ink);
        font-size: 10pt;
        margin: 0 0 1.5mm;
      }
      .footer .loc {
        color: var(--gold);
        letter-spacing: 0.22em;
        font-size: 8pt;
        font-weight: 600;
      }
      .footer .loc .star {
        margin: 0 0.6em;
        color: var(--gold);
      }
      .empty {
        text-align: center;
        padding: 3rem 1.5rem;
        color: #fff;
        font-family: "Playfair Display", serif;
        font-style: italic;
      }
      @media print {
        /* Force the orange paper colour to fill every printed page edge-
           to-edge. Without -webkit-print-color-adjust: exact on html + body,
           Chrome's print pipeline drops the background and the unused space
           below the last item prints as white. */
        html, body {
          background: var(--paper) !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .toolbar { display: none; }
        .stage { padding: 0; gap: 0; background: var(--paper); }
        .page {
          box-shadow: none;
          margin: 0;
          /* exact A4 height so the orange paper covers the whole sheet
             even when the page has only a few rows on it */
          height: 297mm;
          min-height: 297mm;
          page-break-after: always;
          break-after: page;
        }
        .page:last-child {
          page-break-after: auto;
          break-after: auto;
        }
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span>Use <strong>Save as PDF</strong> in the print dialog.</span>
      <button class="primary" onclick="window.print()">Print / Save as PDF</button>
      <button onclick="window.close()">Close</button>
    </div>
    <div id="stage" class="stage"></div>

    <script>
      const KEY = "sb_menu_preview_v1";
      const fmtPrice = (cents, unit, qty) => {
        if (cents == null) return { text: "ask staff", muted: true };
        const dollars = (cents / 100).toFixed(2).replace(/\.00$/, "");
        const q = Number(qty) > 1 ? Number(qty) : 1;
        const unitLabel = q > 1 && unit === "piece" ? "pcs" : unit;
        // qty=1, piece-only items render bare ($X). Anything else gets "/unit" or "/Nunit".
        if (q === 1) {
          return {
            text: unit && unit !== "piece" ? `$${dollars}/${unitLabel}` : `$${dollars}`,
            muted: false,
          };
        }
        return { text: `$${dollars}/${q}${unitLabel}`, muted: false };
      };

      const escapeHtml = (s) =>
        String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

      // ---- DOM builders (nodes, so we can measure & relocate them) ----
      const el = (tag, cls, html) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (html != null) n.innerHTML = html;
        return n;
      };

      const buildItem = (it, showPhoto) => {
        const item = el("div", "item" + (showPhoto ? " with-photo" : ""));
        if (showPhoto) {
          const thumb = el("div", "thumb");
          if (it.imagePath) thumb.style.backgroundImage = `url('${it.imagePath.replace(/'/g, "\\'")}')`;
          item.appendChild(thumb);
        }
        item.appendChild(el("div", "name", escapeHtml(it.name)));
        const p = fmtPrice(it.priceCents, it.unit, it.qty);
        item.appendChild(el("div", "price" + (p.muted ? " muted" : ""), escapeHtml(p.text)));
        return item;
      };

      const buildCatHead = (title, sub, cont) => {
        const frag = document.createElement("div");
        frag.className = "cat-headblock";
        const head = el("div", "cat-head");
        head.appendChild(el("div", "rule"));
        head.appendChild(el("h2", null, escapeHtml(title) + (cont ? ' <span style="font-size:0.6em;font-style:italic;opacity:.75">(cont.)</span>' : "")));
        head.appendChild(el("div", "rule"));
        frag.appendChild(head);
        if (sub && !cont) frag.appendChild(el("p", "cat-sub", escapeHtml(sub)));
        return frag;
      };

      const buildHeader = (doc) => {
        const h = el("div", "header");
        h.innerHTML =
          `<div class="logo"><img src="/swiss_logo.png" alt="Swiss Bakery" onerror="this.style.display='none'" /></div>` +
          `<p class="tagline">${escapeHtml(doc.tagline ?? "")}</p>` +
          `<p class="strapline">${escapeHtml(doc.strapline ?? "")}</p>`;
        const wrap = document.createElement("div");
        wrap.appendChild(h);
        wrap.appendChild(el("div", "top-divider"));
        return wrap;
      };

      const buildFooter = (doc) => {
        const f = el("div", "footer");
        f.appendChild(el("p", "note", escapeHtml(doc.footer ?? "")));
        f.appendChild(el("div", "loc", escapeHtml(doc.location ?? "")));
        return f;
      };

      const newPage = () => {
        const page = el("article", "page");
        page.appendChild(el("div", "frame"));
        const body = el("div", "page-body");
        page.appendChild(body);
        return { page, body };
      };

      const boot = () => {
        const stage = document.getElementById("stage");
        let raw = null;
        try {
          raw = localStorage.getItem(KEY);
        } catch {}
        if (!raw) {
          stage.innerHTML = `<div class="empty">No menu data found.<br/>Open the Menu builder in admin and click Preview.</div>`;
          return;
        }
        let payload;
        try {
          payload = JSON.parse(raw).payload;
        } catch {
          stage.innerHTML = `<div class="empty">Could not read menu data.</div>`;
          return;
        }
        const { doc, categories } = payload;
        if (!categories || categories.length === 0) {
          stage.innerHTML = `<div class="empty">No products selected.<br/>Tick at least one product in the Menu builder.</div>`;
          return;
        }

        // Paginate once fonts are ready so measurements are accurate.
        const run = () => {
          paginate(stage, doc, categories);
          setTimeout(() => window.print(), 500);
        };
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(run).catch(run);
        } else {
          setTimeout(run, 300);
        }
      };

      // Measurement-based paginator: fills each A4 .page exactly, splitting a
      // long category across pages (repeating its header with "(cont.)"), so
      // every printed page has its own frame + orange background and nothing
      // overflows. Header on page 1; footer on the last page only.
      const paginate = (stage, doc, categories) => {
        stage.innerHTML = "";

        // A real empty page to read the usable content height from.
        const probe = newPage();
        probe.page.style.visibility = "hidden";
        stage.appendChild(probe.page);
        const cs = getComputedStyle(probe.page);
        const padTop = parseFloat(cs.paddingTop);
        const padBottom = parseFloat(cs.paddingBottom);
        const fullContentH = probe.page.clientHeight - padTop - padBottom;
        stage.removeChild(probe.page);

        const pages = [];
        let cur = null;
        let curBody = null;
        let usedH = 0;
        let limit = 0;

        const startPage = (isFirst) => {
          const np = newPage();
          stage.appendChild(np.page);
          cur = np.page;
          curBody = np.body;
          usedH = 0;
          limit = fullContentH;
          if (isFirst) {
            const hdr = buildHeader(doc);
            curBody.appendChild(hdr);
            usedH += hdr.getBoundingClientRect().height;
          } else {
            const spacer = el("div");
            spacer.style.height = "8mm";
            curBody.appendChild(spacer);
            usedH += spacer.getBoundingClientRect().height;
          }
          pages.push(np);
        };

        const remaining = () => limit - usedH;

        startPage(true);

        for (const cat of categories) {
          const showPhoto = !!cat.showPhotos || !!doc.showPhotos;
          const cols = cat.columns ?? 2;
          const items = cat.items || [];
          if (items.length === 0) continue;

          let placedAny = false; // has at least one row of THIS category landed?
          let idx = 0;

          while (idx < items.length) {
            // (Re)emit the category header on the current page.
            const headBlock = buildCatHead(cat.title, cat.subtitle, placedAny);
            curBody.appendChild(headBlock);
            let headH = headBlock.getBoundingClientRect().height;

            // If the header itself doesn't leave room for even one row, move
            // it to a fresh page.
            if (remaining() - headH < 40 && usedH > 0) {
              curBody.removeChild(headBlock);
              startPage(false);
              curBody.appendChild(headBlock);
              headH = headBlock.getBoundingClientRect().height;
            }
            usedH += headH;

            const grid = el("div", "items cols-" + cols);
            curBody.appendChild(grid);

            // Add items row by row (a "row" = `cols` items). Measure after
            // each row; if it overflowed, pull the row back, close the grid,
            // and continue this category on a new page.
            let overflowed = false;
            let rowsInGrid = 0; // always allow ≥1 row per page (anti-loop guard)
            while (idx < items.length) {
              const rowNodes = [];
              for (let c = 0; c < cols && idx < items.length; c++, idx++) {
                const n = buildItem(items[idx], showPhoto);
                grid.appendChild(n);
                rowNodes.push(n);
              }
              const gridH = grid.getBoundingClientRect().height;
              if (usedH + gridH > limit && rowsInGrid > 0) {
                // Row doesn't fit and this grid already has a row — roll back
                // and continue the category on the next page.
                for (const n of rowNodes) grid.removeChild(n);
                idx -= rowNodes.length;
                overflowed = true;
                break;
              }
              rowsInGrid++;
            }
            usedH += grid.getBoundingClientRect().height;
            placedAny = true;

            if (overflowed) {
              startPage(false);
            }
          }
        }

        // Footer on the last page; if it would collide with content, give it
        // its own trailing page (frame only).
        const footer = buildFooter(doc);
        const lastBody = pages[pages.length - 1].body;
        lastBody.appendChild(footer);
        // .footer is absolute (bottom of page). Check it doesn't sit on top of
        // the last content block.
        const fr = footer.getBoundingClientRect();
        const lastContent = lastBody.lastElementChild?.previousElementSibling;
        const contentBottom = lastContent ? lastContent.getBoundingClientRect().bottom : 0;
        if (contentBottom && fr.top < contentBottom + 6) {
          lastBody.removeChild(footer);
          const np = newPage();
          stage.appendChild(np.page);
          np.body.appendChild(footer);
        }
      };

      boot();
    </script>
  </body>
</html>
