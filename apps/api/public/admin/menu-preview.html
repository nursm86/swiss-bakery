<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Menu preview · Swiss Bakery</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Match the in-store price-card palette: vivid orange paper,
           charcoal copy, white decorative frame and accent lines, brand-red
           prices for emphasis. */
        --paper: #f37020;
        --ink: #1c1715;
        --gold: #ffffff;
        --gold-soft: rgba(255, 255, 255, 0.6);
        --price: #ffffff;
        --muted: rgba(28, 23, 21, 0.55);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: #4a4f59;
        color: var(--ink);
        font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(11, 20, 38, 0.94);
        color: #fff;
        padding: 10px 16px;
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
        font-size: 13px;
        backdrop-filter: blur(6px);
      }
      .toolbar span { opacity: 0.85; }
      .toolbar button {
        font: inherit;
        padding: 7px 14px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: transparent;
        color: #fff;
        cursor: pointer;
      }
      .toolbar button.primary {
        background: var(--gold);
        color: #1a2a4f;
        border-color: var(--gold);
        font-weight: 700;
      }
      .toolbar button:hover { opacity: 0.92; }
      .stage {
        display: grid;
        place-items: center;
        padding: 28px 16px 80px;
        gap: 24px;
      }
      .page {
        position: relative;
        background: var(--paper);
        width: 210mm;
        /* a definite height, so the footer pins to the bottom of the page */
        height: 297mm;
        min-height: 297mm;
        padding: 18mm 18mm 22mm;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
      }
      .frame {
        position: absolute;
        inset: 8mm;
        border: 1.5px solid var(--gold);
        pointer-events: none;
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 2.5mm;
        border: 0.6px solid var(--gold);
      }
      .header {
        position: relative;
        text-align: center;
        padding-top: 4mm;
      }
      .logo {
        width: 26mm;
        height: 26mm;
        margin: 0 auto 4mm;
        border-radius: 50%;
        overflow: hidden;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 2px 6px rgba(26, 42, 79, 0.12);
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 1mm;
      }
      .tagline {
        font-family: "Playfair Display", serif;
        font-style: italic;
        color: var(--ink);
        font-size: 13pt;
        margin: 0 0 2mm;
      }
      .strapline {
        color: var(--gold);
        letter-spacing: 0.18em;
        font-size: 8pt;
        font-weight: 600;
      }
      .top-divider {
        margin: 6mm auto 5mm;
        height: 1px;
        background: var(--gold);
        opacity: 0.5;
      }
      .cat {
        position: relative;
        margin: 0 0 7mm;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      /* JS paginator wrappers (replace the old .cat box so categories can
         flow across pages). page-body holds the flowing content inside the
         page padding; cat-headblock is the title+rule+subtitle unit. */
      .page-body {
        position: relative;
        height: 100%;
      }
      .cat-headblock {
        margin: 0 0 1mm;
        /* a tiny top padding stops the inner .cat-head margin from collapsing
           through the wrapper, so getBoundingClientRect() is accurate */
        padding-top: 0.1px;
      }
      .page-body .items {
        margin-bottom: 6mm;
      }
      .page-body .items:has(+ .sub-head) {
        margin-bottom: 1.5mm;
      }
      /* Subcategory heading inside a category band (menu-board.js) */
      .sub-head {
        display: flex;
        align-items: center;
        gap: 3mm;
        padding: 2.2mm 0 1.2mm;
      }
      .sub-label {
        color: var(--ink);
        font-size: 8.5pt;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .sub-rule {
        flex: 1;
        height: 1px;
        background: var(--gold);
        opacity: 0.5;
      }
      .cat-head {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 7mm;
        margin: 2mm 0 1mm;
      }
      .cat-head .rule {
        height: 1px;
        background: var(--gold);
        opacity: 0.55;
      }
      .cat-head h2 {
        font-family: "Playfair Display", serif;
        color: var(--ink);
        font-weight: 700;
        font-size: 17pt;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .cat-sub {
        font-family: "Playfair Display", serif;
        font-style: italic;
        color: var(--gold);
        text-align: center;
        font-size: 9pt;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin: 0 0 4mm;
      }
      .items {
        display: grid;
        gap: 0.8mm 8mm;
      }
      .items.cols-1 { grid-template-columns: 1fr; }
      .items.cols-2 { grid-template-columns: 1fr 1fr; }
      .items.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
      .items.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
      .item {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        gap: 4mm;
        padding: 0.7mm 0;
        font-size: 10.5pt;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .item.with-photo {
        grid-template-columns: 11mm 1fr auto;
        align-items: center;
      }
      .item .thumb {
        width: 11mm;
        height: 11mm;
        background: #fff center / cover no-repeat;
        border: 0.6px solid var(--gold);
        border-radius: 50%;
      }
      .item .name {
        color: var(--ink);
        font-weight: 500;
      }
      .item .price {
        color: var(--gold);
        font-weight: 700;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .item .price.muted {
        color: var(--muted);
        font-style: italic;
        font-weight: 500;
      }
      .item .price span {
        display: block;
        text-align: right;
      }
      .footer {
        position: absolute;
        bottom: 12mm;
        left: 18mm;
        right: 18mm;
        text-align: center;
      }
      .footer .note {
        font-family: "Playfair Display", serif;
        font-style: italic;
        color: var(--ink);
        font-size: 10pt;
        margin: 0 0 1.5mm;
      }
      .footer .loc {
        color: var(--gold);
        letter-spacing: 0.22em;
        font-size: 8pt;
        font-weight: 600;
      }
      .footer .loc .star {
        margin: 0 0.6em;
        color: var(--gold);
      }
      .empty {
        text-align: center;
        padding: 3rem 1.5rem;
        color: #fff;
        font-family: "Playfair Display", serif;
        font-style: italic;
      }
      @media print {
        /* Force the orange paper colour to fill every printed page edge-
           to-edge. Without -webkit-print-color-adjust: exact on html + body,
           Chrome's print pipeline drops the background and the unused space
           below the last item prints as white. */
        html, body {
          background: var(--paper) !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .toolbar { display: none; }
        .stage { padding: 0; gap: 0; background: var(--paper); }
        .page {
          box-shadow: none;
          margin: 0;
          /* exact A4 height so the orange paper covers the whole sheet
             even when the page has only a few rows on it */
          height: 297mm;
          min-height: 297mm;
          page-break-after: always;
          break-after: page;
        }
        .page-fit:last-child .page {
          page-break-after: auto;
          break-after: auto;
        }
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span>Use <strong>Save as PDF</strong> in the print dialog.</span>
      <button class="primary" onclick="window.print()">Print / Save as PDF</button>
      <button onclick="window.close()">Close</button>
    </div>
    <div id="stage" class="stage"></div>

    <script type="module">
      // Pages are laid out by the same module as the public /menu card.
      import { paginateMenu } from "/js/menu-board.js?v=20261002a";
      import { formatPriceLines, parseGstSettings } from "/js/pricing.js?v=20261002a";

      const PREVIEW_KEY = "sb_menu_preview_v1";
      const PRINT_DELAY_MS = 500;
      const stage = document.getElementById("stage");

      const showMessage = (lines) => {
        const box = document.createElement("div");
        box.className = "empty";
        lines.forEach((line, i) => box.append(...(i > 0 ? [document.createElement("br")] : []), line));
        stage.replaceChildren(box);
      };

      // The admin's "Preview" button leaves the payload in localStorage (see openMenuPreview).
      const readPayload = () => {
        try {
          return JSON.parse(localStorage.getItem(PREVIEW_KEY) ?? "null")?.payload ?? null;
        } catch {
          return null;
        }
      };

      const payload = readPayload();
      if (!payload) {
        showMessage(["No menu data found.", "Open the Menu builder in admin and click Preview."]);
      } else if (!payload.categories?.length) {
        showMessage(["No products selected.", "Tick at least one product in the Menu builder."]);
      } else {
        const run = () => {
          paginateMenu(stage, payload, { formatPriceLines, gst: payload.gst ?? parseGstSettings() });
          setTimeout(() => window.print(), PRINT_DELAY_MS);
        };
        // Lay out once the fonts are in, so the measurements are right.
        (document.fonts?.ready ?? Promise.resolve()).then(run, run);
      }
    </script>
  </body>
</html>
